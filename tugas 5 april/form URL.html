<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM URL</title>
</head>
<body>
    <h3>Form URL</h3>
  <form>

    <fieldset>

        <legend>URL</legend>
        <br>
      
        <label>URL:</label>
        <input type="url" name="url" placeholder="Masukkan URL">
        <br><br>

        <label>Tanggal:</label>
        <input type="date" name="tanggal">
        <br><br>

        <label>Waktu:</label>
        <input type="time" name="waktu">
        <br><br>

        <label>Jumlah:</label>
        <input type="text" name="jumlah">
        <br><br>

        <input type="submit" value="Send">
        <input type="reset" value="Reset">

    </fieldset>

  </form>
</body>
</html>
